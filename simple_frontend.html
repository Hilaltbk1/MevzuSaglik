<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MevzuSağlık AI - Basit Arayüz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d32f2f;
            text-align: center;
            margin-bottom: 30px;
        }
        .chat-area {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: auto;
            text-align: right;
        }
        .bot-message {
            background-color: #f1f8e9;
            margin-right: auto;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #b71c1c;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .connected {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .disconnected {
            background-color: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚕️ MevzuSağlık AI - Basit Arayüz</h1>
        
        <div class="status connected" id="status">
            ✅ Backend bağlantısı: http://localhost:8001
        </div>
        
        <div class="chat-area" id="chatArea">
            <!-- Mesajlar buraya eklenecek -->
        </div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Mevzuat hakkında sorunuzu yazın..." autocomplete="off">
            <button onclick="sendMessage()">Gönder</button>
        </div>
        
        <div style="margin-top: 20px; font-size: 14px; color: #666;">
            <p><strong>Kullanım:</strong> Sorunuzu yazın ve "Gönder" butonuna tıklayın.</p>
            <p><strong>Backend:</strong> Python 3.9 ile çalışan basit API</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:8001";
        let sessionUuid = "test-session-123";
        let userName = "Misafir";
        
        // Enter tuşu ile gönder
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Mesaj gönderme fonksiyonu
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Kullanıcı mesajını ekle
            addMessage(message, 'user');
            input.value = '';
            
            try {
                // Backend'e istek gönder
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        user_name: userName,
                        session_uuid: sessionUuid,
                        user_id: "Anonymous"
                    })
                });
                
                const data = await response.json();
                addMessage(data.response, 'bot');
                
            } catch (error) {
                addMessage(`❌ Hata: ${error.message}`, 'bot');
            }
        }
        
        // Mesaj ekleme fonksiyonu
        function addMessage(text, sender) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
            messageDiv.textContent = text;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // Sayfa yüklendiğinde backend bağlantısını test et
        window.onload = async function() {
            try {
                const response = await fetch(`${BACKEND_URL}/health`);
                if (response.ok) {
                    document.getElementById('status').textContent = '✅ Backend bağlantısı başarılı!';
                }
            } catch (error) {
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = '❌ Backend bağlantısı başarısız. Lütfen backend\'i kontrol edin.';
            }
        };
        
        // İlk açılış mesajı
        addMessage("Merhaba! MevzuSağlık AI asistanına hoş geldiniz. Size nasıl yardımcı olabilirim?", 'bot');
    </script>
</body>
</html>
